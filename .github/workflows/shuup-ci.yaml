name: shuup-ci

on:
  pull_request:
    paths:
      - "shuup/**"
      - "shuup_workbench/**"
      - "setup.py"
      - "requirements-tests.txt"
      - "Dockerfile.prod"
      - "deploy/shuup/**"
      - ".github/workflows/shuup-ci.yaml"
  push:
    branches: [ development, main ]
    paths:
      - "shuup/**"
      - "shuup_workbench/**"
      - "setup.py"
      - "requirements-tests.txt"
      - "Dockerfile.prod"
      - "deploy/shuup/**"
      - ".github/workflows/shuup-ci.yaml"

jobs:
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.14.4

      - name: Lint and render dev and prod values
        run: |
          helm lint deploy/shuup -f deploy/shuup/values.yaml
          helm lint deploy/shuup -f deploy/shuup/values-dev.yaml
          helm template shuup deploy/shuup -f deploy/shuup/values.yaml > /dev/null
          helm template shuup deploy/shuup -f deploy/shuup/values-dev.yaml > /dev/null

  image:
    needs: chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Install yq
      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      # Read version from the Helm values for this branch
      - name: Read image version
        run: |
          if [ "${{ github.ref_name }}" = "development" ]; then VALUES=values-dev.yaml; else VALUES=values.yaml; fi
          VERSION=$(yq '.image.tag' "deploy/shuup/$VALUES")
          echo "IMAGE_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USER }}/shuup-workbench:${IMAGE_VERSION} \
            -f Dockerfile.prod \
            .

      - name: Push Docker image
        if: github.event_name == 'push'
        run: |
          docker push ${{ secrets.DOCKER_USER }}/shuup-workbench:${IMAGE_VERSION}

      - name: Push branch tag
        if: github.event_name == 'push'
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then TAG=latest; else TAG=development; fi
          docker tag ${{ secrets.DOCKER_USER }}/shuup-workbench:${IMAGE_VERSION} ${{ secrets.DOCKER_USER }}/shuup-workbench:$TAG
          docker push ${{ secrets.DOCKER_USER }}/shuup-workbench:$TAG

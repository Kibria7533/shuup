# Production values. Secrets are not set here. Create the Secret named by
# existingSecret in the target namespace with these keys:
#   DATABASE_URL, DJANGO_SECRET_KEY, MIRAGE_SECRET_KEY

replicaCount: 4

image:
  repository: 01720588884/shuup-workbench
  tag: "1.0.11"
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: regcred

existingSecret: shuup-secret

# Non-secret settings
config:
  djangoAllowedHosts: "uttorbongi.questionhut.com"

service:
  type: NodePort
  port: 80
  targetPort: 8000
  nodePort: 32348

ingress:
  enabled: false
  className: nginx
  host: uttorbongi.questionhut.com
  tls: true
  tlsSecretName: shuup-tls

resources:
  requests:
    cpu: 2000m
    memory: 2024Mi
  limits:
    memory: 4Gi

migrate:
  enabled: false

media:
  enabled: true
  size: 5Gi
  storageClassName: nfs-client
  mountPath: /app/shuup_workbench/var/media

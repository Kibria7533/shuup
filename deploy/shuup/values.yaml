# Production values. Secrets are not set here. Create the Secret named by
# existingSecret in the target namespace with these keys:
#   DATABASE_URL, DJANGO_SECRET_KEY, MIRAGE_SECRET_KEY

replicaCount: 2

image:
  repository: 01720588884/shuup-workbench
  tag: "1.0.1"
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: regcred

existingSecret: shuup-secret

# Non-secret settings
config:
  djangoAllowedHosts: "shop.example.com"

service:
  type: NodePort
  port: 80
  targetPort: 8000
  nodePort: 32348

ingress:
  enabled: true
  className: nginx
  host: shop.example.com
  tls: true
  tlsSecretName: shuup-tls

resources:
  requests:
    cpu: 1000m
    memory: 1024Mi
  limits:
    memory: 2Gi

migrate:
  enabled: false
